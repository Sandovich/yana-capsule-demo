<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Капсула от Яны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: витрина в духе Zara — белый лист, вещи без фона, мелкий тонкий капс, |01| нумерация, тонкие линии, без скруглений. Характер: «честное зеркало со вкусом Яны» */
:root{
  --paper:#ffffff; --ink:#000000; --mute:#707070; --hair:#000000; --fog:#f5f5f3; --alert:#b3261e; --soft:#e9e9e6;
  --f-ui:'Inter Tight','Helvetica Neue',Helvetica,Arial,sans-serif;
  --f-logo:'Playfair Display','Didot','Times New Roman',serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:clip}
body{margin:0;background:var(--paper);color:var(--ink);font:300 13px/1.45 var(--f-ui);text-transform:uppercase;letter-spacing:.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea,select{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
button{background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:1px solid var(--ink);outline-offset:3px}
img{display:block;max-width:100%}
.app{max-width:460px;margin:0 auto;padding-block:0 130px;min-height:100%}
.still .scr>*{animation:none!important}

/* шапка */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);display:flex;justify-content:space-between;align-items:center;height:56px}
.burger{width:34px;height:20px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.burger i{display:block;height:1px;background:var(--ink);transition:transform .3s}
.burger[aria-expanded="true"] i:first-child{transform:translateY(3.5px) rotate(12deg)}
.burger[aria-expanded="true"] i:last-child{transform:translateY(-3.5px) rotate(-12deg)}
.hdr-r{display:flex;gap:16px;align-items:center;font-size:12px}
.cnt{display:inline-block;border:1px solid var(--ink);border-top:0;padding:0 4px;margin-left:4px;font-size:11px;line-height:13px}
.note{font-size:10px;color:var(--mute);letter-spacing:.06em;margin:2px 0 14px}
.menu{position:fixed;inset:0;background:var(--paper);z-index:8;padding:76px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));animation:fadeIn .25s}
.menu .in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.menu button{text-align:left;font-size:14px}
.menu button[aria-current="step"]{font-weight:500}
.menu button[disabled]{color:#b9b9b9;cursor:default}

/* шаги */
.steps-nav{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;font-size:11px;padding-bottom:4px;border-bottom:1px solid var(--hair)}
.steps-nav::-webkit-scrollbar{display:none}
.steps-nav span{white-space:nowrap;color:#a5a5a5;padding-bottom:6px}
.steps-nav span.done{color:var(--ink)}
.steps-nav span.cur{color:var(--ink);font-weight:500;box-shadow:0 1px 0 var(--ink)}
.n{font-variant-numeric:tabular-nums}
.n::before{content:"|"}.n::after{content:"| "}
.free{display:inline-block;border:1px solid var(--ink);padding:3px 6px;font-size:10px;letter-spacing:.06em}

/* типографика */
.logo{font-family:var(--f-logo);font-weight:400;text-transform:uppercase;letter-spacing:-.06em;line-height:.8;margin:0}
.ttl{font-family:var(--f-logo);font-weight:400;font-size:clamp(30px,9vw,38px);line-height:1;letter-spacing:-.03em;margin:0;text-wrap:balance}
.lbl{font-size:11px;color:var(--mute);letter-spacing:.06em}
.txt{font-size:12.5px;line-height:1.55;text-transform:none;letter-spacing:0;max-width:40ch;margin:0}
.big-txt{font-family:var(--f-logo);text-transform:none;font-size:22px;line-height:1.2;letter-spacing:-.01em;margin:0}

.scr{display:flex;flex-direction:column;gap:22px}
.scr>*{min-width:0;animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
.q{display:flex;flex-direction:column;gap:10px}

/* выбор */
.list{border-top:1px solid var(--hair)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--hair)}
.opt small{display:block;color:var(--mute);font-size:10.5px;margin-top:3px;letter-spacing:.04em}
.opt .mk{width:9px;height:9px;border:1px solid var(--ink);flex:none;transition:background .2s,transform .3s}
.opt[aria-pressed="true"]{font-weight:500}
.opt[aria-pressed="true"] .mk{background:var(--ink);transform:rotate(45deg)}
.opt .pr{font-variant-numeric:tabular-nums;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--ink);padding:8px 11px;font-size:11.5px;transition:background .18s,color .18s,transform .12s}
.tag:active,.btn:active,.plus:active,.sbtn:active{transform:scale(.96)}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.reveal{border-left:1px solid var(--ink);padding-left:14px;display:flex;flex-direction:column;gap:6px;animation:rise .4s both}

/* вещи */
.grid{display:grid;gap:22px 10px;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}
.it{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-width:0}
.it .ph{width:100%;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.it .ph img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.it:hover .ph img{transform:scale(1.04)}
.it .nm{font-size:10.5px;line-height:1.3;letter-spacing:.03em;overflow-wrap:anywhere}
.it .pr{font-size:11px;font-variant-numeric:tabular-nums}
.it .sz{font-size:10px;color:var(--mute);text-transform:none;letter-spacing:0;line-height:1.35}
.badge{position:absolute;left:0;top:0;background:var(--ink);color:var(--paper);font-size:10px;padding:3px 6px;letter-spacing:.06em;z-index:1}
.badge.wait{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}
.banner{border:1px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:11.5px;line-height:1.4}
.banner b{font-weight:500}
.rvg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.rv{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:10.5px;line-height:1.25;border:1px solid var(--soft);padding:6px 4px;min-width:0;overflow-wrap:anywhere;transition:border-color .2s,background .2s}
.rv img{height:66px;object-fit:contain}
.rv[aria-pressed="true"]{border-color:var(--ink);background:var(--fog)}
.rv[aria-pressed="true"]::after{content:"не моё";font-size:9px;background:var(--ink);color:var(--paper);padding:1px 5px;margin-top:2px}
.buy{font-size:10.5px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;padding:2px 0;margin-top:2px}
.plus{width:24px;height:24px;display:grid;place-items:center;font-size:17px;font-weight:300;transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.plus[aria-pressed="true"]{transform:rotate(45deg);background:var(--ink);color:var(--paper)}

/* тест вкуса */
.deck{position:relative;height:430px}
.card{position:absolute;inset:0 18px;background:var(--paper);border:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;touch-action:pan-y;user-select:none;cursor:grab;transition:transform .3s cubic-bezier(.2,.7,.2,1),opacity .3s}
.card.under{transform:translateY(10px) scale(.96);border-color:var(--soft);z-index:0}
.card.top{z-index:1}
.card img{height:300px;width:100%;pointer-events:none;max-width:100%;object-fit:contain}
.card .nm{font-size:12px}
.stamp{position:absolute;top:18px;font-size:13px;font-weight:500;letter-spacing:.1em;border:1px solid var(--ink);padding:4px 8px;opacity:0;transition:opacity .15s}
.stamp.yes{left:18px}.stamp.no{right:18px}
.sbtns{display:flex;justify-content:center;gap:28px}
.sbtn{width:56px;height:56px;border:1px solid var(--ink);display:grid;place-items:center;font-size:20px;transition:background .2s,color .2s,transform .12s}
.sbtn:hover{background:var(--ink);color:var(--paper)}
.meter{height:1px;background:#d9d9d9;position:relative}
.meter i{position:absolute;left:0;top:-1px;height:3px;background:var(--ink);transition:width .45s cubic-bezier(.2,.7,.2,1)}
.meter.over i{background:var(--alert)}

/* фигура, рост, цвета */
.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.fig{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;font-size:10px;letter-spacing:.02em;text-align:center;border-bottom:1px solid transparent;hyphens:manual;min-width:0;transition:border-color .2s}
.fig svg{width:30px;height:52px;color:#c7c7c7;transition:color .25s}
.fig[aria-pressed="true"]{border-color:var(--ink);font-weight:500}
.fig[aria-pressed="true"] svg{color:var(--ink)}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;accent-color:var(--ink);height:1px}
.range output{font-size:15px;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.sws{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 8px}
.swb{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.03em}
.sw{width:30px;height:30px;border:1px solid #d6d6d6;position:relative;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.sw[data-s="love"]{outline:1px solid var(--ink);outline-offset:3px;transform:scale(1.08)}
.sw[data-s="never"]::after{content:"";position:absolute;inset:-4px;background:linear-gradient(135deg,transparent calc(50% - .5px),var(--ink) calc(50% - .5px) calc(50% + .5px),transparent calc(50% + .5px))}
textarea{width:100%;min-height:76px;border:0;border-bottom:1px solid var(--ink);padding:8px 0;resize:vertical;text-transform:none;font-size:13px;background:transparent}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:12.5px;line-height:1.45}.check span{text-transform:none;letter-spacing:0}.check b{font-weight:500}
.check input{accent-color:var(--ink);width:16px;height:16px;margin:0;flex:none}

/* фото */
.ups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.up{aspect-ratio:3/4;border:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden;cursor:pointer;font-size:11px;text-align:center;padding:8px}
.up img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--fog);animation:fadeIn .4s}
.up .ok{position:absolute;left:0;bottom:0;background:var(--ink);color:var(--paper);font-size:10px;padding:3px 6px}
.up .pl{font-size:26px;font-weight:300;line-height:1}

/* кнопки внизу */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:1px solid var(--hair);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:rise .35s both}
.bar .in{max-width:460px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;height:44px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--paper);font-size:11.5px;letter-spacing:.08em;transition:opacity .2s,transform .12s}
.btn.line{background:var(--paper);color:var(--ink);border:1px solid var(--ink);flex:0 0 auto;padding:0 16px}
.btn[disabled]{opacity:.25;cursor:not-allowed}

/* лендинг */
.hero{position:relative;display:flex;justify-content:center;margin-top:4px}
.hero .logo{position:absolute;left:-4px;right:-4px;top:0;font-size:clamp(108px,33vw,150px);text-align:center;z-index:1;pointer-events:none;mix-blend-mode:multiply}
.hero img{height:min(108vw,470px);margin-top:calc(clamp(108px,33vw,150px)*.86 + 14px);animation:heroIn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes heroIn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.howto{border-top:1px solid var(--hair)}
.howto button{display:flex;gap:10px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--hair);font-size:12px;align-items:center;transition:background .2s}
.howto button:active{background:var(--fog)}
.howto .ht{flex:1;min-width:0}
.howto .go{font-size:20px;line-height:1;color:var(--ink);width:14px;text-align:right}
.exrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.exrow .xc{position:relative;border:1px solid var(--ink);aspect-ratio:3/4;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.exrow .xc img{width:100%;height:100%;object-fit:contain}.exrow .xc .xs{position:absolute;left:6px;top:6px;font-size:10px;letter-spacing:.06em;padding:3px 6px;background:var(--ink);color:var(--paper)}.exrow .xc .xs.no{background:var(--paper);color:var(--ink);border:1px solid var(--ink)}.exarr{display:grid;grid-template-columns:1fr 1fr 24px 1.3fr;gap:8px;align-items:center}.exarr .xc{border:1px solid var(--ink);aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;letter-spacing:.06em;text-align:center;color:var(--mute);background:#fff;overflow:hidden}.exarr .xc img{width:100%;height:100%;object-fit:contain;background:var(--fog)}.exarr .ar{text-align:center;font-size:18px}.exgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.exgrid .xc{position:relative;aspect-ratio:3/4;background:#fff;border:1px solid var(--hair)}.exgrid img{width:100%;height:100%;object-fit:contain}.exgrid .role{width:18px;height:18px;font-size:9.5px}.expts{display:flex;flex-direction:column;border-top:1px solid var(--hair)}.expts span{padding:10px 0;border-bottom:1px solid var(--hair);font-size:13px;line-height:1.4;text-transform:none;letter-spacing:0}

/* двойник */
.avbox{background:var(--fog);display:flex;justify-content:center;align-items:center;height:440px;position:relative;overflow:hidden}
.avbox img{height:420px;animation:heroIn 1s cubic-bezier(.2,.7,.2,1) both}
.scan{position:absolute;left:0;right:0;height:1px;background:var(--ink);animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{top:8%}50%{top:92%}100%{top:8%}}
.honest{border:1px solid var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.honest b{font-weight:500}

/* образы */
.looks{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.looks::-webkit-scrollbar{display:none}
.look{flex:0 0 88%;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.look.solo{flex-basis:100%}
.stage{background:var(--fog);height:380px;display:grid;grid-template-columns:1fr 78px;padding:10px;gap:4px;position:relative}
.stage>img{height:360px;margin:auto}
.stage.tw{display:block;height:420px;overflow:hidden}
.mood{position:relative;aspect-ratio:3/4;width:100%;max-width:100%;background:#efeeec;overflow:hidden;touch-action:auto}
.mood.ed{touch-action:pan-y}
.mood .mi{position:absolute;object-fit:contain;max-width:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.13));pointer-events:none}
.mood.ed .mi{pointer-events:auto;cursor:grab;touch-action:pan-y}
.mood .mi.pk{mix-blend-mode:multiply;filter:none}
.mood .mx{position:absolute;z-index:40;width:26px;height:26px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0}
.mood .mi.sel{outline:1px dashed var(--ink);outline-offset:3px}
.mood .twbtn{position:absolute;right:10px;bottom:10px;height:40px;padding:0 12px 0 9px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;z-index:30;cursor:pointer}.mood .twbtn svg{width:18px;height:18px}.mood.mini .twbtn span{display:none}.mood.mini .twbtn{padding:0;width:28px;height:28px;justify-content:center}
.mood .mown{position:absolute;left:10px;bottom:10px;font-size:9.5px;border:1px dashed var(--ink);background:var(--paper);padding:4px 6px;line-height:1.25;z-index:30}
.mood.mini{width:62px;flex:none;align-self:flex-start}
.mood.mini .mi{filter:none}
.helper{border:1px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:8px}
.helper .txt{margin:0;font-size:12.5px}
.hsug{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.hsug button{display:flex;flex-direction:column;gap:3px;background:none;border:1px solid var(--hair);padding:4px;text-align:left;min-width:0;cursor:pointer}
.hsug img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff}
.hsug span{font-size:10px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hsug b{font-weight:400;font-size:10.5px}
.hsug small{font-size:10.5px;color:var(--mute);line-height:1.25}
.msz{display:flex;gap:6px;align-items:center;justify-content:space-between}
.stage.tw .avw{position:absolute;left:50%;top:10px;bottom:10px;aspect-ratio:360/950;transform:translateX(-50%)}
.stage.tw .av{width:100%;height:100%;display:block;max-width:none}
.stage.tw .ly{position:absolute;transform:translate(-50%,0);height:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}
.stage.tw .col{position:absolute;right:8px;top:10px;bottom:10px}
.dnd{position:relative;height:min(118vw,460px);background:var(--fog);touch-action:none;overflow:hidden;user-select:none}
.dnd .avw{position:absolute;left:46%;top:2%;height:96%;aspect-ratio:360/950;transform:translateX(-50%);transition:outline-color .15s}
.dnd .avw.over{outline:2px dashed var(--ink);outline-offset:-2px}
.dnd .av{width:100%;height:100%;display:block;max-width:none;pointer-events:none}
.dnd .ly{position:absolute;transform:translate3d(-50%,0,0);height:auto;max-width:none;cursor:grab;touch-action:none;will-change:left,top,width;backface-visibility:hidden;filter:drop-shadow(0 2px 3px rgba(0,0,0,.18))}.dnd .ly.mv{filter:none}.dnd{isolation:isolate;transform:translateZ(0)}
.dnd .ly.snap{transition:left .25s cubic-bezier(.2,.8,.2,1),top .25s cubic-bezier(.2,.8,.2,1)}
.dszb .viewsw button{width:40px;height:40px;border:1px solid var(--ink);font-size:20px;color:var(--ink);display:inline-grid;place-items:center}.dszb .viewsw{display:flex;gap:8px}
.dnd{flex-shrink:0}.cutbox{display:flex;flex-direction:column;gap:8px;flex-shrink:0}.cutprev{flex-shrink:0;background:#efeeec;height:240px;display:flex;align-items:center;justify-content:center;padding:12px}.cutprev img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.dnd .tray{position:absolute;right:8px;bottom:8px;width:88px;height:112px;background:var(--paper);border:1px dashed var(--ink);display:flex;align-items:center;justify-content:center;padding:4px}
.dnd .tray img{max-width:100%;max-height:100%;object-fit:contain;cursor:grab;touch-action:none}
.dnd .hint{position:absolute;left:10px;top:10px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);max-width:46%}
.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.92;filter:drop-shadow(0 8px 14px rgba(0,0,0,.28))}
.stage .col{display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:0}
